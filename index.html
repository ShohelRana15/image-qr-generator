<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Hub</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- QRCode -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
</head>

<body>

<div class="container">

    <div class="header">

        <h1>
            <i class="fa-solid fa-qrcode"></i>
            QR Hub
        </h1>

        <p>
            Image & Text QR Code Generator
        </p>

    </div>

    <!-- Tabs -->

    <div class="tabs">

        <button class="tab active" id="imageTab">
            <i class="fa-regular fa-image"></i>
            Image QR
        </button>

        <button class="tab" id="textTab">
            <i class="fa-solid fa-font"></i>
            Text QR
        </button>

    </div>

    <!-- Card -->

    <div class="card">

        <!-- IMAGE SECTION -->

        <div id="imageSection">

            <h2>Upload Image</h2>

            <input
                type="file"
                id="imageFile"
                accept="image/*">

            <div class="preview-box">
<div class="crop-tools">

    <button
        id="cropBtn"
        class="secondary-btn">

        Crop

    </button>

    <button
        id="zoomInBtn"
        class="secondary-btn">

        Zoom +

    </button>

    <button
        id="zoomOutBtn"
        class="secondary-btn">

        Zoom -

    </button>

    <button
        id="rotateBtn"
        class="secondary-btn">

        Rotate

    </button>

    <button
        id="resetBtn"
        class="secondary-btn">

        Reset

    </button>

</div>
                <img
                    id="imagePreview"
                    src=""
                    alt=""
                    style="display:none;">

            </div>

            <button
                id="uploadBtn"
                class="primary-btn">

                <i class="fa-solid fa-cloud-arrow-up"></i>
                Upload Image

            </button>

        </div>

        <!-- TEXT SECTION -->

        <div
            id="textSection"
            style="display:none;">

            <h2>Generate Text QR</h2>

            <textarea
                id="textInput"
                rows="6"
                placeholder="Write anything..."></textarea>

            <button
                id="generateBtn"
                class="primary-btn">

                <i class="fa-solid fa-qrcode"></i>

                Generate QR

            </button>

        </div>

        <hr>

        <!-- RESULT -->

        <div class="result">

    <div class="result-grid">

        <!-- LEFT -->

        <div class="left-result">

            <h2>Image Preview</h2>

            <img
                id="finalPreview"
                src=""
                alt=""
                style="display:none;max-width:100%;border-radius:12px;">

            <input
                type="text"
                id="imageUrl"
                placeholder="Image URL will appear here..."
                readonly>

            <div class="actions">

                <button
                    id="copyBtn"
                    class="secondary-btn">

                    <i class="fa-regular fa-copy"></i>
                    Copy URL

                </button>

            </div>

        </div>

        <!-- RIGHT -->

        <div class="right-result">

            <h2>QR Code</h2>

            <canvas id="qrcode"></canvas>

            <br><br>

            <button
                id="downloadBtn"
                class="primary-btn">

                <i class="fa-solid fa-download"></i>
                Download QR

            </button>

        </div>

    </div>

    <div id="message" class="message"></div>

</div>
        

            <h2>Result</h2>

            <input
                type="text"
                id="imageUrl"
                placeholder="Image URL will appear here..."
                readonly>

            <div id="qrContainer">

                <canvas id="qrcode"></canvas>

            </div>

            <div class="actions">

                <button
                    id="copyBtn"
                    class="secondary-btn">

                    <i class="fa-regular fa-copy"></i>

                    Copy URL

                </button>

                <button
                    id="downloadBtn"
                    class="primary-btn">

                    <i class="fa-solid fa-download"></i>

                    Download QR

                </button>

            </div>

        </div>

        <!-- MESSAGE -->

        <div
            id="message"
            class="message">

        </div>

    </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<script src="script.js"></script>

</body>
</html>
