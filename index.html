<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Hub</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>QR Hub</h1>

<p class="subtitle">
Image & Text QR Code Generator
</p>

<div class="tabs">

<button class="tab active">
🖼️ Image QR
</button>

<button class="tab">
📝 Text QR
</button>

</div>

<div class="card">

<div id="imageSection">

<h2>Upload Image</h2>

<input type="file" id="imageFile">

<br><br>

<button id="uploadBtn">
Upload Image
</button>

</div>

<div id="textSection" style="display:none;">

<h2>Enter Text</h2>

<textarea id="textInput"
rows="5"
placeholder="Write something..."></textarea>

<br><br>

<button id="textBtn">
Generate QR
</button>

</div>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
