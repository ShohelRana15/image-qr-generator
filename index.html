<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Hub</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>QR Hub</h1>

    <p class="subtitle">
        Image & Text QR Code Generator
    </p>

    <div class="tabs">

        <button class="tab active" id="imageTab">
            🖼️ Image QR
        </button>

        <button class="tab" id="textTab">
            📝 Text QR
        </button>

    </div>

    <div class="card">

        <!-- IMAGE -->

        <div id="imageSection">

            <h2>Upload Image</h2>

            <input type="file" id="imageFile">

            <br><br>

            <button class="primary-btn" id="uploadBtn">
                Upload Image
            </button>

        </div>

        <!-- TEXT -->

        <div id="textSection">

            <h2>Enter Text</h2>

            <textarea
                id="textInput"
                rows="6"
                placeholder="Write anything here..."></textarea>

            <br><br>

            <button class="primary-btn" id="generateBtn">
                Generate QR
            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
