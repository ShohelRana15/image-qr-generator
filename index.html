<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>QR Hub v3.0</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

</head>

<body>

<div class="container">

<div class="header">

<h1>

<i class="fa-solid fa-qrcode"></i>

QR Hub

</h1>

<p>

Professional Image & Text QR Generator

</p>

</div>

<div class="tabs">

<button id="imageTab"
class="tab active">

<i class="fa-regular fa-image"></i>

Image QR

</button>

<button id="textTab"
class="tab">

<i class="fa-solid fa-font"></i>

Text QR

</button>

</div>

<div class="main-card">

<!-- LEFT -->

<div class="left-panel">

<div id="imageSection">

<h2>

Upload Image

</h2>

<div id="dropArea"
class="drop-area">

<i class="fa-solid fa-cloud-arrow-up"></i>

<p>

Drag & Drop Image

</p>

<p>

or

</p>

<input
type="file"
id="imageFile"
accept="image/*">

</div>

<div class="preview-box">

<img
id="imagePreview"
style="display:none;">

</div>

<div class="crop-tools">

<button
id="cropBtn"
class="secondary-btn">

Crop

</button>

<button
id="zoomInBtn"
class="secondary-btn">

+

</button>

<button
id="zoomOutBtn"
class="secondary-btn">

−

</button>

<button
id="rotateBtn"
class="secondary-btn">

Rotate

</button>

<button
id="resetBtn"
class="secondary-btn">

Reset

</button>

</div>

<button
id="uploadBtn"
class="primary-btn">

<i class="fa-solid fa-cloud-arrow-up"></i>

Upload Image

</button>

</div>

<!-- TEXT -->

<div
id="textSection"
style="display:none;">

<h2>

Generate Text QR

</h2>

<textarea

id="textInput"

rows="8"

placeholder="Write anything...">

</textarea>

<button

id="generateBtn"

class="primary-btn">

Generate QR

</button>

</div>

</div>

<!-- RIGHT -->

<div class="right-panel">

<h2>

QR Preview

</h2>

<img

id="finalPreview"

style="display:none;">

<canvas
id="qrcode">

</canvas>

<input

id="imageUrl"

readonly

placeholder="Public URL">

<div class="button-group">

<button

id="copyBtn"

class="secondary-btn">

Copy URL

</button>

<button

id="downloadBtn"

class="primary-btn">

Download QR

</button>

</div>

<div
id="message">

</div>

</div>

</div>

<footer class="footer">

© 2026 QR Hub v3.0 • Developed with ❤️ by SR Infinity • All Rights Reserved.

</footer>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

<script src="script.js"></script>

</body>

</html>
